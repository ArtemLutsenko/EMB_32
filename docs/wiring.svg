<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 700" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="holes" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect x="8" y="8" width="4" height="4" rx="1" fill="#c9c3b5"/>
    </pattern>
  </defs>

  <rect width="920" height="700" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-size="18" font-weight="600" fill="#222">
    ESP32-S3-DevKitM-1 — LED (GPIO17) + кнопка (GPIO18) на макетній платі
  </text>

  <!-- ===================== Breadboard ===================== -->
  <rect x="40" y="60" width="520" height="500" rx="6" fill="#f3efe6" stroke="#d8d1c1"/>
  <rect x="60" y="80" width="480" height="380" fill="url(#holes)"/>
  <rect x="60" y="264" width="480" height="12" fill="#e4ddcd"/>
  <!-- GND rail -->
  <line x1="55" y1="488" x2="545" y2="488" stroke="#2f6fd0" stroke-width="2"/>
  <rect x="60" y="496" width="480" height="20" fill="url(#holes)"/>
  <line x1="55" y1="524" x2="545" y2="524" stroke="#2f6fd0" stroke-width="2"/>
  <text x="48" y="511" font-size="16" font-weight="700" fill="#2f6fd0">−</text>
  <text x="60" y="545" font-size="11" fill="#2f6fd0">шина GND (синя, «−»)</text>

  <!-- ===================== ESP32-S3-DevKitM-1 ===================== -->
  <rect x="650" y="60" width="210" height="490" rx="8" fill="#1f3d5c"/>
  <rect x="700" y="68" width="110" height="60" rx="4" fill="#b8bec6"/>
  <text x="755" y="96" text-anchor="middle" font-size="11" fill="#333">ESP32-S3</text>
  <text x="755" y="110" text-anchor="middle" font-size="11" fill="#333">MINI-1</text>
  <rect x="690" y="532" width="40" height="24" rx="4" fill="#9aa1a8"/>
  <rect x="780" y="532" width="40" height="24" rx="4" fill="#9aa1a8"/>
  <text x="710" y="574" text-anchor="middle" font-size="10" fill="#555">UART</text>
  <text x="800" y="574" text-anchor="middle" font-size="10" fill="#555">USB</text>
  <text x="755" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">ESP32-S3</text>
  <text x="755" y="318" text-anchor="middle" font-size="11" fill="#cfd8e3">DevKitM-1</text>
  <text x="680" y="88" font-size="10" fill="#cfd8e3">J1</text>
  <text x="830" y="88" font-size="10" fill="#cfd8e3" text-anchor="end">J3</text>

  <!-- J1 (left header): y = 100 + i*19 -->
  <g font-size="10" fill="#e8eef5">
    <g fill="#d4af37">
      <circle cx="665" cy="100" r="5"/><circle cx="665" cy="119" r="5"/><circle cx="665" cy="138" r="5"/>
      <circle cx="665" cy="157" r="5"/><circle cx="665" cy="176" r="5"/><circle cx="665" cy="195" r="5"/>
      <circle cx="665" cy="214" r="5"/><circle cx="665" cy="233" r="5"/><circle cx="665" cy="252" r="5"/>
      <circle cx="665" cy="271" r="5"/><circle cx="665" cy="290" r="5"/><circle cx="665" cy="309" r="5"/>
      <circle cx="665" cy="328" r="5"/><circle cx="665" cy="347" r="5"/><circle cx="665" cy="366" r="5"/>
      <circle cx="665" cy="385" r="5"/><circle cx="665" cy="404" r="5"/><circle cx="665" cy="423" r="5"/>
      <circle cx="665" cy="480" r="5"/>
    </g>
    <circle cx="665" cy="442" r="6" fill="#e07b1a" stroke="#fff" stroke-width="1.5"/>
    <circle cx="665" cy="461" r="6" fill="#2e9d4f" stroke="#fff" stroke-width="1.5"/>
    <circle cx="665" cy="499" r="6" fill="#222" stroke="#fff" stroke-width="1.5"/>

    <text x="675" y="104">3V3</text><text x="675" y="123">0</text><text x="675" y="142">1</text>
    <text x="675" y="161">2</text><text x="675" y="180">3</text><text x="675" y="199">4</text>
    <text x="675" y="218">5</text><text x="675" y="237">6</text><text x="675" y="256">7</text>
    <text x="675" y="275">8</text><text x="675" y="294">9</text><text x="675" y="313">10</text>
    <text x="675" y="332">11</text><text x="675" y="351">12</text><text x="675" y="370">13</text>
    <text x="675" y="389">14</text><text x="675" y="408">15</text><text x="675" y="427">16</text>
    <text x="675" y="446" font-weight="700" fill="#ffb366">17</text>
    <text x="675" y="465" font-weight="700" fill="#7ee39b">18</text>
    <text x="675" y="484">5V</text>
    <text x="675" y="503" font-weight="700" fill="#fff">G</text>
  </g>

  <!-- J3 (right header) -->
  <g font-size="10" fill="#e8eef5" text-anchor="end">
    <g fill="#d4af37">
      <circle cx="845" cy="100" r="5"/><circle cx="845" cy="119" r="5"/><circle cx="845" cy="138" r="5"/>
      <circle cx="845" cy="157" r="5"/><circle cx="845" cy="176" r="5"/><circle cx="845" cy="195" r="5"/>
      <circle cx="845" cy="214" r="5"/><circle cx="845" cy="233" r="5"/><circle cx="845" cy="252" r="5"/>
      <circle cx="845" cy="271" r="5"/><circle cx="845" cy="290" r="5"/><circle cx="845" cy="309" r="5"/>
      <circle cx="845" cy="328" r="5"/><circle cx="845" cy="347" r="5"/><circle cx="845" cy="366" r="5"/>
      <circle cx="845" cy="385" r="5"/><circle cx="845" cy="404" r="5"/><circle cx="845" cy="423" r="5"/>
      <circle cx="845" cy="442" r="5"/><circle cx="845" cy="461" r="5"/><circle cx="845" cy="480" r="5"/>
      <circle cx="845" cy="499" r="5"/>
    </g>
    <text x="835" y="104">G</text><text x="835" y="123">RST</text><text x="835" y="142">46</text>
    <text x="835" y="161">45</text><text x="835" y="180">RX</text><text x="835" y="199">TX</text>
    <text x="835" y="218">42</text><text x="835" y="237">41</text><text x="835" y="256">40</text>
    <text x="835" y="275">39</text><text x="835" y="294">38</text><text x="835" y="313">37</text>
    <text x="835" y="332">36</text><text x="835" y="351">35</text><text x="835" y="370">34</text>
    <text x="835" y="389">33</text><text x="835" y="408">26</text><text x="835" y="427">21</text>
    <text x="835" y="446">20</text><text x="835" y="465">19</text><text x="835" y="484">48</text>
    <text x="835" y="503">47</text>
  </g>

  <!-- ===================== Wires ===================== -->
  <!-- GPIO17 -> resistor (orange) -->
  <polyline points="665,442 620,442 620,180 540,180" fill="none" stroke="#e07b1a" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="550" y="172" font-size="12" font-weight="600" fill="#e07b1a">GPIO17</text>

  <!-- GPIO18 -> button (green) -->
  <polyline points="665,461 600,461 600,370 490,370" fill="none" stroke="#2e9d4f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="546" y="362" font-size="12" font-weight="600" fill="#2e9d4f">GPIO18</text>

  <!-- Board GND -> GND rail (black) -->
  <polyline points="665,499 580,499 580,506 530,506" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="530" cy="506" r="4" fill="#222"/>

  <!-- ===================== Resistor 220 Ω ===================== -->
  <g>
    <line x1="510" y1="180" x2="540" y2="180" stroke="#888" stroke-width="3"/>
    <line x1="410" y1="180" x2="440" y2="180" stroke="#888" stroke-width="3"/>
    <rect x="440" y="169" width="70" height="22" rx="10" fill="#e6c79c" stroke="#b9996b"/>
    <rect x="450" y="169" width="6" height="22" fill="#d42020"/>
    <rect x="462" y="169" width="6" height="22" fill="#d42020"/>
    <rect x="474" y="169" width="6" height="22" fill="#6b3a1d"/>
    <rect x="496" y="169" width="6" height="22" fill="#c9a227"/>
    <text x="475" y="210" text-anchor="middle" font-size="12" fill="#333">220 Ω</text>
    <text x="475" y="224" text-anchor="middle" font-size="10" fill="#666">(150–330 Ω)</text>
  </g>

  <!-- ===================== LED (anode right, cathode left) ===================== -->
  <g>
    <line x1="378" y1="180" x2="410" y2="180" stroke="#888" stroke-width="3"/>
    <polygon points="378,162 378,198 348,180" fill="#ff4d4d" stroke="#b02020" stroke-width="1.5"/>
    <line x1="346" y1="162" x2="346" y2="198" stroke="#b02020" stroke-width="3"/>
    <line x1="330" y1="180" x2="346" y2="180" stroke="#888" stroke-width="3"/>
    <path d="M360 156 l8 -10 m-4 0 h4 v4 M370 160 l8 -10 m-4 0 h4 v4" fill="none" stroke="#ff4d4d" stroke-width="1.5"/>
    <text x="396" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#b02020">+</text>
    <text x="334" y="160" text-anchor="middle" font-size="14" font-weight="700" fill="#b02020">−</text>
    <text x="362" y="216" text-anchor="middle" font-size="12" fill="#333">LED</text>
    <text x="362" y="230" text-anchor="middle" font-size="10" fill="#666">+ довга ніжка (анод)</text>
    <text x="362" y="243" text-anchor="middle" font-size="10" fill="#666">− коротка, плоский бік (катод)</text>
  </g>
  <!-- LED cathode -> GND (black) -->
  <polyline points="330,180 100,180 100,506" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="100" cy="506" r="4" fill="#222"/>

  <!-- ===================== Button ===================== -->
  <g>
    <line x1="470" y1="370" x2="490" y2="370" stroke="#888" stroke-width="3"/>
    <line x1="370" y1="370" x2="390" y2="370" stroke="#888" stroke-width="3"/>
    <rect x="390" y="335" width="80" height="70" rx="4" fill="#3a3a3a"/>
    <circle cx="430" cy="370" r="20" fill="#1c1c1c" stroke="#555"/>
    <text x="430" y="425" text-anchor="middle" font-size="12" fill="#333">Тактова кнопка</text>
    <text x="430" y="440" text-anchor="middle" font-size="10" fill="#666">(ніжки по діагоналі)</text>
  </g>
  <!-- Button -> GND (black) -->
  <polyline points="370,370 160,370 160,506" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="160" cy="506" r="4" fill="#222"/>

  <!-- ===================== Legend ===================== -->
  <g font-size="12" fill="#222">
    <rect x="40" y="596" width="840" height="92" rx="6" fill="#f7f7f7" stroke="#ddd"/>
    <text x="56" y="618" font-weight="700">З'єднання (гребінка J1, внизу ліворуч)</text>
    <line x1="56" y1="636" x2="86" y2="636" stroke="#e07b1a" stroke-width="4"/>
    <text x="94" y="640">GPIO17 → резистор 220 Ω → анод LED (+); катод LED (−) → GND</text>
    <line x1="56" y1="656" x2="86" y2="656" stroke="#2e9d4f" stroke-width="4"/>
    <text x="94" y="660">GPIO18 → кнопка → GND  (зовнішній резистор не потрібен: INPUT_PULLUP)</text>
    <line x1="56" y1="676" x2="86" y2="676" stroke="#222" stroke-width="4"/>
    <text x="94" y="680">G (J1, останній пін) → синя шина «−» макетки</text>
    <text x="864" y="618" font-size="11" fill="#666" text-anchor="end">GPIO19/20 не чіпати — це USB D−/D+</text>
  </g>
</svg>
